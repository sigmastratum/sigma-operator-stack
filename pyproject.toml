[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sigma-operator-stack"
version = "0.1.0a3"
description = "Local-first repository authority and recovery tools for coding agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
dependencies = ["jsonschema>=4.10,<5"]
authors = [{name = "Sigma Stratum"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Documentation = "https://github.com/sigmastratum/sigma-operator-stack#readme"
Issues = "https://github.com/sigmastratum/sigma-operator-stack/issues"
Repository = "https://github.com/sigmastratum/sigma-operator-stack"

[project.scripts]
sos = "sos.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sos*"]

[tool.setuptools.package-data]
"sos.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
