name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install exact release-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements/release.txt
          python -m pip install --disable-pip-version-check -r requirements/audit.txt
      - name: Dependency vulnerability audit
        run: |
          python -m pip_audit --strict --progress-spinner off -r requirements/release.txt
          python -m pip_audit --strict --progress-spinner off .
      - name: Public boundary and workflow contracts
        run: |
          python tools/check_public_release.py --repository .
          python tools/check_dependency_licenses.py --repository .
          python tools/check_public_release_pointer.py --repository .
          python tools/check_workflows.py --repository .
      - name: Source suite with zero skips
        env:
          PYTHONPATH: src
        run: python tools/run_zero_skip_tests.py
      - name: Clean source and whitespace
        run: |
          git diff --check
          test -z "$(git status --short)"

  release-artifacts:
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact release-test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements/release.txt
          python -m pip install --disable-pip-version-check -r requirements/audit.txt
      - name: Dependency vulnerability audit
        run: |
          python -m pip_audit --strict --progress-spinner off -r requirements/release.txt
          python -m pip_audit --strict --progress-spinner off .
      - name: Build exact wheel twice
        run: |
          mkdir -p "$RUNNER_TEMP/wheel-a" "$RUNNER_TEMP/wheel-b" "$RUNNER_TEMP/bundle"
          python tools/build_release_wheel.py --candidate "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/wheel-a"
          python tools/build_release_wheel.py --candidate "$GITHUB_SHA" --output-dir "$RUNNER_TEMP/wheel-b"
          cmp "$RUNNER_TEMP/wheel-a/sigma_operator_stack-0.1.0a2-py3-none-any.whl" "$RUNNER_TEMP/wheel-b/sigma_operator_stack-0.1.0a2-py3-none-any.whl"
      - name: Fresh non-editable installed-wheel suite
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --disable-pip-version-check -r requirements/release.txt
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP/wheel-a/sigma_operator_stack-0.1.0a2-py3-none-any.whl"
          cd "$RUNNER_TEMP"
          SOS_REQUIRE_INSTALLED=1 "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/tools/run_zero_skip_tests.py" --tests "$GITHUB_WORKSPACE/tests"
          "$RUNNER_TEMP/wheel-env/bin/sos" --version
      - name: Generate SBOM and canonical bundle
        run: |
          python -m venv "$RUNNER_TEMP/sbom-env"
          "$RUNNER_TEMP/sbom-env/bin/python" -m pip install --disable-pip-version-check -r requirements/runtime.txt
          "$RUNNER_TEMP/sbom-env/bin/python" -m pip install --no-deps "$RUNNER_TEMP/wheel-a/sigma_operator_stack-0.1.0a2-py3-none-any.whl"
          "$RUNNER_TEMP/wheel-env/bin/python" tools/generate_release_sbom.py --candidate "$GITHUB_SHA" --wheel "$RUNNER_TEMP/wheel-a/sigma_operator_stack-0.1.0a2-py3-none-any.whl" --environment-python "$RUNNER_TEMP/sbom-env/bin/python" --output "$RUNNER_TEMP/bundle/sigma-operator-stack-0.1.0a2.cdx.json"
          python tools/check_dependency_licenses.py --repository . --sbom "$RUNNER_TEMP/bundle/sigma-operator-stack-0.1.0a2.cdx.json"
          python tools/finalize_release_bundle.py --candidate "$GITHUB_SHA" --wheel "$RUNNER_TEMP/wheel-a/sigma_operator_stack-0.1.0a2-py3-none-any.whl" --sbom "$RUNNER_TEMP/bundle/sigma-operator-stack-0.1.0a2.cdx.json" --output-dir "$RUNNER_TEMP/bundle"
          cp "$RUNNER_TEMP/wheel-a/sigma_operator_stack-0.1.0a2-py3-none-any.whl" "$RUNNER_TEMP/bundle/"
          cd "$RUNNER_TEMP/bundle"
          sha256sum -c SHA256SUMS
          PYTHONPATH="$GITHUB_WORKSPACE/tools" python -c "from pathlib import Path; from start_sos_alpha import verify_bundle; verify_bundle(Path('$RUNNER_TEMP/bundle'))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sigma-operator-stack-${{ github.sha }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 14
