name: Documentation mismatch
description: Report a public command, reason code, support claim, link, or tutorial mismatch.
title: "[docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: "Quote only public SOS documentation. Do not include secrets, private source, prompts, raw .sigma data, filesystem paths, hostnames, or customer data."
  - type: input
    id: version
    attributes: {label: SOS version}
    validations: {required: true}
  - type: input
    id: os_profile
    attributes: {label: OS profile}
    validations: {required: true}
  - type: input
    id: command
    attributes: {label: Related command or document}
    validations: {required: true}
  - type: input
    id: reason_code
    attributes: {label: Related reason code or none}
    validations: {required: true}
  - type: textarea
    id: reproducer
    attributes: {label: Synthetic reproduction or exact public mismatch}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-content confirmation
      options:
        - label: I removed secrets, private source, prompts, raw .sigma data, paths, hostnames, and customer data.
          required: true
