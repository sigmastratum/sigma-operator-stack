name: Bounded feature proposal
description: Propose one local-first capability with explicit authority and non-goals.
title: "[proposal] "
labels: ["enhancement", "needs-contract"]
body:
  - type: markdown
    attributes:
      value: "Proposals must preserve local records and fail-closed boundaries. Do not include secrets, private source, prompts, raw .sigma data, filesystem paths, hostnames, or customer data."
  - type: input
    id: version
    attributes: {label: SOS version used for comparison}
    validations: {required: true}
  - type: input
    id: os_profile
    attributes: {label: Target OS profile}
    validations: {required: true}
  - type: input
    id: command
    attributes: {label: Proposed or related command}
    validations: {required: true}
  - type: input
    id: reason_code
    attributes: {label: Proposed or related reason code}
    validations: {required: true}
  - type: textarea
    id: reproducer
    attributes: {label: Synthetic motivating scenario}
    validations: {required: true}
  - type: textarea
    id: non_goals
    attributes: {label: Non-goals and mutation boundary}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-content confirmation
      options:
        - label: I removed secrets, private source, prompts, raw .sigma data, paths, hostnames, and customer data.
          required: true
